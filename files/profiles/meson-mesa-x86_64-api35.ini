# Amphora Bionic/Linux Mesa profile.
# -D__AMPHORA__ is the Amphora-owned switch (NDK toolchain + Linux Mesa paths).
# -D__TERMUX__ remains as a Pipetto/Mesa compatibility alias for upstream
# #ifdef __TERMUX__ AHardwareBuffer / WSI gates.
[binaries]
c = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang'
cpp = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang++'
ar = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
strip = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
c_ld = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
cpp_ld = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
pkg-config = '/usr/bin/pkg-config'

[built-in options]
c_args = ['-I/opt/android-sysroot/usr/include', '-Wno-error', '-D__USE_GNU', '-D__AMPHORA__', '-D__TERMUX__', '-fno-emulated-tls', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES']
cpp_args = ['-I/opt/android-sysroot/usr/include', '-Wno-error', '-D__USE_GNU', '-D__AMPHORA__', '-D__TERMUX__', '-fno-emulated-tls', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES']
c_link_args = ['-L/opt/android-sysroot/usr/lib', '-landroid-shmem', '-lc++_shared', '-Wl,-rpath,/usr/lib', '-Wl,--as-needed', '-Wl,--undefined-version', '-Wl,-z,max-page-size=16384']
cpp_link_args = ['-L/opt/android-sysroot/usr/lib', '-landroid-shmem', '-lc++_shared', '-Wl,-rpath,/usr/lib', '-Wl,--as-needed', '-Wl,--undefined-version', '-Wl,-z,max-page-size=16384']

[properties]
pkg_config_libdir = '/opt/android-sysroot/usr/lib/pkgconfig:/opt/android-sysroot/usr/share/pkgconfig'
needs_exe_wrapper = true
sys_root = '/opt/android-sysroot'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
