[binaries]
c = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang'
cpp = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang++'
ar = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
as = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-as'
ld = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld'
strip = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
ranlib = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib'
nm = '/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm'
pkg-config = '/usr/bin/pkg-config'

[built-in options]
c_args = ['-fPIC', '-O2', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES', '-I/opt/android-sysroot/usr/include']
cpp_args = ['-fPIC', '-O2', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES', '-I/opt/android-sysroot/usr/include']
c_link_args = ['-L/opt/android-sysroot/usr/lib', '-Wl,-rpath,/usr/lib', '-Wl,--allow-shlib-undefined', '-Wl,-z,max-page-size=16384']
cpp_link_args = ['-L/opt/android-sysroot/usr/lib', '-Wl,-rpath,/usr/lib', '-Wl,--allow-shlib-undefined', '-Wl,-z,max-page-size=16384']

[properties]
needs_exe_wrapper = true
sys_root = '/opt/android-sysroot'
pkg_config_libdir = '/opt/android-sysroot/usr/lib/pkgconfig:/opt/android-sysroot/usr/share/pkgconfig'

[host_machine]
system = 'android'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
